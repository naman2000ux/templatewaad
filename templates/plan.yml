stages:
  - stage: s2
    jobs:
    - job: s2
      steps:
      - task: TerraformTask@5
        inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'git-svc'
            backendAzureRmResourceGroupName: 'heron-rg'
            backendAzureRmStorageAccountName: ${{ parameters.storage-account}}
            backendAzureRmContainerName: 'tera'
            backendAzureRmKey: 'prod.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          environmentServiceNameAzureRM: 'svc1'